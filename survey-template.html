<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>__TITLE__ - 问卷</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Georgia,"KaiTi","STKaiti","Songti SC","SimSun","Microsoft YaHei",serif;background:#f0efe9;background-image:radial-gradient(rgba(120,105,80,.05) 1px,transparent 1px);background-size:22px 22px;min-height:100vh;color:#2b2620;}
  .page{max-width:760px;margin:0 auto;padding:32px 16px 70px;}
  header{background:#fdfcf9;border:1px solid #e0d8c8;border-top:4px solid #8b4513;border-radius:3px;padding:30px 34px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 40px rgba(60,45,20,.07);margin-bottom:20px;}
  header h1{font-size:28px;font-weight:700;letter-spacing:2px;text-align:center;color:#2b2620;}
  header p{color:#7a7163;margin-top:10px;line-height:1.8;white-space:pre-wrap;font-size:14px;text-align:center;}
  .qi{background:#fdfcf9;border:1px solid #e0d8c8;border-radius:3px;padding:22px 28px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .qhead{display:flex;align-items:baseline;gap:10px;font-size:17px;border-bottom:1px dashed #ddd2bf;padding-bottom:12px;}
  .qnum{flex:none;color:#8b4513;font-weight:700;font-family:Georgia,serif;}
  .qtitle{flex:1;line-height:1.6;font-weight:600;}
  .qtype{flex:none;font-size:11px;color:#8b4513;background:#fff;border:1px solid #c9a876;border-radius:2px;padding:2px 8px;letter-spacing:1px;}
  .req{color:#b5541f;}
  .qbody{margin-top:16px;}
  .opts{display:flex;flex-direction:column;gap:4px;}
  .opt{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;font-size:15px;color:#3a352c;transition:.15s;}
  .opt:hover{background:#f6f1e6;}
  .opt input{position:absolute;opacity:0;}
  .opt span::before{content:"";display:inline-block;width:17px;height:17px;border:1.5px solid #a89c86;margin-right:9px;vertical-align:-3px;background:#fff;transition:.15s;}
  .opt input[type=radio] + span::before{border-radius:50%;}
  .opt input:checked + span::before{background:#8b4513;border-color:#8b4513;box-shadow:inset 0 0 0 3px #fdfcf9;}
  textarea{width:100%;border:none;border-bottom:1.5px solid #c9b896;background:transparent;padding:8px 4px;font:inherit;font-size:15px;color:#2b2620;resize:vertical;outline:none;line-height:1.8;}
  textarea:focus{border-bottom-color:#8b4513;}
  .stars{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .star{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .star input{display:none;}
  .star span{width:36px;height:36px;border-radius:50%;border:1.5px solid #b0a48e;display:flex;align-items:center;justify-content:center;font-size:15px;font-family:Georgia,serif;color:#6b5f4c;background:#fff;transition:.15s;}
  .star input:checked + span{background:#8b4513;color:#fff;border-color:#8b4513;}
  .star-hint{margin-left:6px;color:#8b4513;font-size:13px;}
  footer{margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  #err{display:none;width:100%;background:#fbf0ea;border:1px solid #e0b39a;color:#a03b13;border-radius:2px;padding:12px 14px;font-size:14px;line-height:1.7;}
  #submitBtn{width:100%;padding:14px;border:1px solid #2b2620;background:#2b2620;color:#f5f2ea;font:inherit;font-size:17px;font-weight:700;letter-spacing:6px;cursor:pointer;transition:.2s;}
  #submitBtn:hover{background:#8b4513;border-color:#8b4513;}
  #submitBtn:disabled{opacity:.55;cursor:not-allowed;}
  #success{display:none;background:#fdfcf9;border:1px solid #e0d8c8;border-radius:3px;padding:50px 30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 40px rgba(60,45,20,.07);}
  #success .t{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;border:3px solid #c0392b;display:flex;align-items:center;justify-content:center;color:#c0392b;font-size:38px;line-height:1;}
  #success h2{font-size:22px;color:#2b2620;letter-spacing:2px;}
  #success p{color:#7a7163;margin-top:10px;}
  @media(max-width:520px){header,.qi{padding:18px 16px;}}
</style>
</head>
<body>
<div class="page">
  <div id="formWrap">
    <header><h1></h1></header>
    <form id="surveyForm"></form>
  </div>
  <div id="success">
    <div class="t">&#10004;</div>
    <h2>提交成功</h2>
    <p>感谢你的参与，你的回答已成功保存。</p>
  </div>
</div>
<script>
(function(){
  var Q = __QUESTIONS__;
  var QID = __QID__;
  var BASE = __BASE__;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

  var cls = { single:'单选题', multiple:'多选题', text:'填空题', rating:'评分题' };
  var form = document.getElementById('surveyForm');
  var h1 = document.querySelector('header h1');
  var desc = document.createElement('p');
  form.innerHTML = '';

  Q.forEach(function(c, idx){
    var num = String(idx+1).padStart(2,'0');
    var reqMark = c.required ? ' <span class="req">*</span>' : '';
    var control = '';
    if(c.type === 'text'){
      control = '<textarea name="'+c.id+'" rows="3" placeholder="请输入内容"></textarea>';
    } else if(c.type === 'rating'){
      var stars = '';
      for(var i=1;i<=c.ratingMax;i++){
        stars += '<label class="star"><input type="radio" name="'+c.id+'" value="'+i+'"><span>'+i+'</span></label>';
      }
      control = '<div class="stars">'+stars+'<span class="star-hint"></span></div>';
    } else if(c.type === 'single'){
      control = '<div class="opts">'+c.options.map(function(o,oi){
        return '<label class="opt"><input type="radio" name="'+c.id+'" value="'+(oi+1)+'"><span>'+esc(o)+'</span></label>';
      }).join('')+'</div>';
    } else {
      control = '<div class="opts">'+c.options.map(function(o,oi){
        return '<label class="opt"><input type="checkbox" name="'+c.id+'" value="'+(oi+1)+'"><span>'+esc(o)+'</span></label>';
      }).join('')+'</div>';
    }
    var row = document.createElement('div');
    row.className = 'qi';
    row.innerHTML = '<div class="qhead"><span class="qnum">'+num+'</span><span class="qtitle">'+esc(c.title)+reqMark+'</span><span class="qtype">'+cls[c.type]+'</span></div><div class="qbody">'+control+'</div>';
    form.appendChild(row);
  });

  var foot = document.createElement('footer');
  var err = document.createElement('div'); err.id='err';
  var btn = document.createElement('button'); btn.type='submit'; btn.id='submitBtn'; btn.textContent='提交问卷';
  foot.appendChild(err); foot.appendChild(btn);
  form.appendChild(foot);

  document.querySelectorAll('.stars').forEach(function(wrap){
    wrap.querySelectorAll('input').forEach(function(input){
      input.addEventListener('change', function(){ wrap.querySelector('.star-hint').textContent='已选择 '+input.value+' 分'; });
    });
  });

  function validate(){
    var errors = [];
    Q.forEach(function(c){
      var group = form.querySelectorAll('[name="'+c.id+'"]');
      if(c.type==='text'){
        var v = (group[0]||{}).value || '';
        if(c.required && !v.trim()) errors.push('请填写「'+c.title+'」');
        else if(v.trim().length>5000) errors.push('「'+c.title+'」内容过长');
      } else {
        var checked = Array.prototype.filter.call(group, function(i){ return i.checked; });
        if(c.required && !checked.length) errors.push('请选择「'+c.title+'」');
      }
    });
    return errors;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var errs = validate();
    if(errs.length){ err.innerHTML = errs.map(esc).join('<br>'); err.style.display='block'; return; }
    err.style.display='none';
    var answers = {};
    Q.forEach(function(c){
      var group = form.querySelectorAll('[name="'+c.id+'"]');
      if(c.type==='text'){ answers[c.id] = (group[0]||{}).value.trim(); }
      else { answers[c.id] = Array.prototype.filter.call(group, function(i){return i.checked;}).map(function(i){return i.value;}); }
    });
    btn.disabled=true; btn.textContent='提交中...';
    fetch(BASE+'submit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id:QID, answers:answers })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        if(res.ok){ document.getElementById('formWrap').style.display='none'; document.getElementById('success').style.display='block'; }
        else { btn.disabled=false; btn.textContent='重新提交'; err.textContent=(res.j&&res.j.error)||'提交失败，请重试'; err.style.display='block'; }
      })
      .catch(function(){
        btn.disabled=false; btn.textContent='重新提交';
        err.textContent='网络错误，请检查连接后重试'; err.style.display='block';
      });
  });
})();
</script>
</body>
</html>
